<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage photos</title>
<style>body{max-width:1100px;margin:2rem auto;padding:0 1rem;font:16px system-ui,sans-serif;color:#222}header{display:flex;justify-content:space-between;align-items:center;gap:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-top:2rem}article{border:1px solid #ccc;padding:.75rem}article img{width:100%;height:200px;object-fit:contain}label,input,button{margin:.4rem 0}input[type=text]{box-sizing:border-box;width:100%;padding:.5rem}form{margin:.7rem 0}.hidden{color:#a00;font-weight:bold}</style></head>
<body><header><h1>Manage photos</h1><form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button>Sign out</button></form></header>
<section><h2>Upload photo</h2><form method="post" action="/admin/photos" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="photo">Image (JPEG, PNG, GIF, or WebP; max 15 MiB)</label><input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/gif,image/webp" required><label for="new-label">Label (optional)</label><input id="new-label" type="text" name="label" maxlength="500"><button type="submit">Upload</button></form></section>
<section><h2>Photos</h2>{{if .Photos}}<main class="grid">{{range .Photos}}<article><img src="/media/{{.ID}}" alt="{{.Label}}">{{if .Hidden}}<p class="hidden">Hidden</p>{{end}}<form method="post" action="/admin/photos/{{.ID}}/label"><input type="hidden" name="csrf" value="{{$.CSRF}}"><label>Label <input type="text" name="label" maxlength="500" value="{{.Label}}"></label><button type="submit">Save label</button></form><form method="post" action="/admin/photos/{{.ID}}/visibility"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button type="submit">{{if .Hidden}}Show to family{{else}}Hide from family{{end}}</button></form><form method="post" action="/admin/photos/{{.ID}}/delete" data-confirm="Delete this photo permanently?"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button type="submit">Delete photo</button></form></article>{{end}}</main>{{else}}<p>No photos uploaded yet.</p>{{end}}</section><script src="/static/admin.js" defer></script></body>
</html>
