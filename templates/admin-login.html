<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header"><div class="identity">Family gallery</div><span class="header-note">Administration</span></header>
    <main class="access-layout"><section class="access-card" aria-labelledby="admin-title"><div class="access-banner access-banner--admin"><p class="eyebrow">For the photo keeper</p><h1 id="admin-title">Gallery administration</h1></div><div class="access-body"><p>Sign in to manage the family collection.</p><form method="post" action="/admin/login"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="field"><label for="username">Username</label><input id="username" name="username" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"></div><button class="button-primary" type="submit">Sign in</button></form><p class="login-link"><a href="/">← Family gallery</a></p></div></section></main>
  </div>
</body>
</html>
